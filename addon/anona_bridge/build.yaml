build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base:3.19
  amd64: ghcr.io/home-assistant/amd64-base:3.19
  armv7: ghcr.io/home-assistant/armv7-base:3.19
labels:
  org.opencontainers.image.title: Anona Pano Bridge
  org.opencontainers.image.source: https://github.com/Darkhand81/anona-ha-bridge
args:
  # Module + git ref the add-on image is built from. Pin REF to a tag/commit for
  # reproducible builds; defaults to the latest main.
  ANONA_MODULE: github.com/Darkhand81/anona-ha-bridge
  ANONA_REF: main
