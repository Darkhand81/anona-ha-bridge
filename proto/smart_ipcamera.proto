message P2PConnect {
  message Request {
    required uint32 remote_peer = 1;
    required uint32 duration_seconds = 2;
    optional string signaling_channel_name = 3;
    optional string ak = 4;
    optional string sk = 5;
    optional string token = 6;
    optional string region = 7;
    optional string signaling_channel_arn = 8;
    optional bool use_trickle_ice = 9;
    optional string https_endpoint = 10;
    optional string wss_endpoint = 11;
    optional string stun_address = 12;
    optional bool stun_only = 13;
  }
  message Response {
    required string signaling_channel_name = 1;
    required ErrorCode error_code = 2;
    optional string ak = 4;
    optional string sk = 5;
    optional string token = 6;
    optional string region = 7;
    optional string signaling_channel_arn = 8;
    optional bool use_trickle_ice = 9;
    optional string https_endpoint = 10;
    optional string wss_endpoint = 11;
    optional string stun_address = 12;
    optional bool stun_only = 13;
  }
}
message P2PDisconnect {
  message Request {
    required string signaling_channel_name = 1;
  }
  message Response {
    required string signaling_channel_name = 1;
    required ErrorCode error_code = 2;
  }
}
message SyncP2pConfig {
  required uint32 remote_peer = 1;
  required string p2p_key = 2;
  required string client_id = 3;
  optional string stun_address = 4;
  optional string turn_address = 5;
  optional string turn_username = 6;
  optional string turn_password = 7;
}
message SyncP2pConfigDisconnect {
  required string client_id = 1;
}
message WakeupDevice {
  message Request {
    optional uint32 wakeup_duration = 1;
  }
  message Response {
    required ErrorCode error_code = 1;
  }
}
message FormatStorage {
  enum TYPE {
    INTERNAL = 1;
    EXTERNAL = 2;
  }
  enum Status {
    FAILED = 1;
    OPERATING = 2;
    COMPLETED = 3;
  }
  message Request {
    required FormatStorage.TYPE type = 1;
  }
  message Response {
    required FormatStorage.TYPE type = 1;
    optional MemoryStorage memory_storage = 2;
  }
}
message DetectionAssistant {
  message Config {
    enum Code {
      CLOUD_STORAGE_DISABLE = 1;
      CLOUD_STORAGE_ENABLE = 2;
    }
    required string session_id = 1;
    required DetectionAssistant.Config.Code code = 2;
    optional uint64 evt_ts = 3;
  }
  message DetectionResult {
    message List {
      repeated DetectionAssistant.DetectionResult list = 1;
    }
    required IPCamera.EventID event_id = 1;
    required AlgTag alg_tag = 2;
    required uint64 timestamp = 3;
    required string session_id = 4;
    optional TrackId track_id = 5;
    optional bool push = 6;
  }
  message UploadInfo {
    message Request {
      required string session_id = 1;
      repeated uint32 id_list = 2;
      optional string cover_suffix = 3;
      optional string video_suffix = 4;
      optional string cover_content_type = 5;
      optional string video_content_type = 6;
      optional TrackId track_id = 7;
    }
    message Response {
      required string session_id = 1;
      repeated DetectionAssistant.UploadInfo video_upload_info_list = 2;
      optional DetectionAssistant.UploadInfo cover_upload_info = 3;
      optional TrackId track_id = 4;
    }
    message Notify {
      message List {
        required string session_id = 1;
        repeated DetectionAssistant.UploadInfo.Notify list = 2;
      }
      required string key = 1;
      required uint32 fragment_duration = 2;
      optional bool is_cover = 3;
      optional VideoResolution video_resolution = 4;
      optional uint32 video_size = 5;
      optional TrackId track_id = 6;
    }
    required string url = 1;
    required string key = 2;
    optional uint32 id = 3;
  }
  message LocalRecord {
    message List {
      repeated DetectionAssistant.LocalRecord list = 1;
    }
    required string session_id = 1;
    required string video_file_dir = 2;
    required string image_file_dir = 3;
    optional VideoResolution video_resolution = 4;
    optional TrackId track_id = 5;
  }
  message RecordingDone {
    required string session_id = 1;
  }
}
message WebRtcStart {
  message Request {
    message TurnInfo {
      message List {
        repeated WebRtcStart.Request.TurnInfo list = 1;
      }
      required string turn_address = 1;
      required string user_name = 2;
      required string pass_word = 3;
    }
    message P2PLiveInfo {
      required bool live = 1;
      optional VideoResolution manualResolution = 2;
      optional LiveResolutionChoice resolutionChoice = 3;
    }
    required uint32 client_type = 1;
    required string client_id = 2;
    required bytes sdp_offer_compressed = 3;
    required string stun_address = 4;
    required WebRtcStart.Request.TurnInfo.List turn_info_list = 5;
    optional WebRtcStart.Request.P2PLiveInfo p2p_live_info = 6;
    optional bool is_shared_user = 7;
    optional SnapshotRequest snapshot_request = 8;
    optional bool use_trickle_ice = 9;
  }
  message Response {
    required ErrorCode error_code = 1;
    optional bytes sdp_answer_compressed = 2;
    optional uint32 client_type = 3;
    optional string client_id = 4;
    optional bool use_trickle_ice = 5;
  }
}
message WebRtcCandidate {
  required uint32 client_type = 1;
  required string client_id = 2;
  required string candidate = 3;
  required string sdp_mid = 4;
  required string sdp_m_line_index = 5;
}
message WebRtcDisconnect {
  required uint32 client_type = 1;
  required string client_id = 2;
}
message WebRtcWakeup {
  required uint32 client_type = 1;
  required string client_id = 2;
}
message PanTiltControl {
  enum Direction {
    UP = 1;
    DOWN = 2;
    LEFT = 3;
    RIGHT = 4;
    STOP = 5;
  }
  enum ActionType {
    CLICK = 1;
    CONTINUOUS = 2;
  }
  required PanTiltControl.Direction direction = 1;
  required PanTiltControl.ActionType action_type = 2;
}
message DailyVideoStatus {
  message Request {
    required uint64 start_timestamp = 1;
    required uint64 end_timestamp = 2;
    optional string url = 3;
  }
  message Property {
    repeated AlgTag tags = 1;
  }
  message DailyStatus {
    required uint64 date = 1;
    repeated DailyVideoStatus.Property property = 2;
    optional uint32 video_type = 3;
  }
  message Response {
    required ErrorCode error = 1;
    required bool has_more = 2;
    repeated DailyVideoStatus.DailyStatus daily_status = 3;
  }
}
message TimelineVideoList {
  enum TimelineType {
    CONTINUOUS_EVENT = 31;
    AOV = 2;
    CONTINUOUS_EVENT_AOV = 3;
  }
  message EventInfo {
    required AlgTag type = 1;
    required uint64 start_time = 2;
    required uint64 end_time = 3;
    optional TrackId track_id = 4;
  }
  message VideoClip {
    required uint64 start_time = 1;
    required uint64 end_time = 2;
    required VideoType type = 3;
    repeated TimelineVideoList.EventInfo events = 4;
    optional uint64 aov_start_pts = 5;
    optional uint64 aov_end_pts = 6;
    optional AovInterval aov_interval = 7;
  }
  message Request {
    required uint64 start_timestamp = 1;
    required uint64 end_timestamp = 2;
    optional string url = 3;
    optional TimelineVideoList.TimelineType timeline_type = 4;
  }
  message Response {
    required ErrorCode error = 1;
    repeated TimelineVideoList.VideoClip videos = 2;
    repeated TimelineVideoList.EventInfo events = 3;
    optional bool has_more = 4;
  }
}
message FilteredVideoList {
  enum Direction {
    FORWARD = 1;
    BACKWARD = 2;
  }
  enum VideoTypeFilter {
    ALL_TYPE = 1;
    CONTINUOUS = 2;
    EVENT = 3;
    AOV = 4;
    CONTINUOUS_EVENT_AOV = 5;
  }
  message VideoClip {
    required uint64 start_time = 1;
    required uint64 end_time = 2;
    required VideoType type = 3;
    repeated AlgTag event_tags = 4;
    optional bool unremovable = 5;
    optional uint64 aov_start_pts = 6;
    optional uint64 aov_end_pts = 7;
    optional AovInterval aov_interval = 8;
  }
  message Request {
    required uint64 reference_time = 1;
    required FilteredVideoList.Direction direction = 2;
    required uint32 max_count = 3;
    required FilteredVideoList.VideoTypeFilter video_type_filter = 4;
    repeated AlgTag event_type_filter = 5;
    optional string url = 6;
  }
  message Response {
    required ErrorCode error = 1;
    repeated FilteredVideoList.VideoClip videos = 2;
    required bool has_more = 3;
  }
}
message P2PDownload {
  enum PlayMode {
    NORMAL = 1;
    SPEED_4X = 2;
    SPEED_16X = 3;
    SPEED_32X = 4;
    SPEED_DAILY_OVERVIEW = 5;
  }
  message SliceInfo {
    required uint64 start_timestamp = 1;
    required uint64 end_timestamp = 2;
    optional uint64 aov_start_pts = 3;
    optional uint64 aov_end_pts = 4;
  }
  message VideoRequest {
    required uint64 data_id = 1;
    required P2PDownload.PlayMode play_mode = 2;
    required uint64 start_timestamp = 3;
    required uint64 end_timestamp = 4;
    required uint32 client_type = 5;
    required string client_id = 6;
    optional uint32 max_slice_count = 7;
    optional string url = 8;
  }
  message EventVideoRequest {
    required uint64 data_id = 1;
    required P2PDownload.PlayMode play_mode = 2;
    required string event_id = 3;
    required uint32 client_type = 4;
    required string client_id = 5;
    optional uint32 max_slice_count = 6;
    optional uint64 start_timestamp = 7;
    optional string url = 8;
  }
  message VideoResponse {
    required ErrorCode error = 1;
    required uint64 data_id = 2;
    required CODEC video_codec = 3;
    required CODEC audio_codec = 4;
    repeated P2PDownload.SliceInfo slice_info = 5;
    required bool has_more = 6;
    optional uint32 capability_max_slice_count = 7;
    optional uint64 event_video_start_timestamp = 8;
    optional uint64 event_video_end_timestamp = 9;
    optional bool unremovable = 10;
  }
  message StartDownloadThumbnailRequest {
    required uint64 data_id = 1;
    required uint64 timestamp = 2;
    required uint32 client_type = 3;
    required string client_id = 4;
    optional string url = 5;
  }
  message StartDownloadThumbnailResponse {
    required ErrorCode error = 1;
    required uint64 data_id = 2;
    optional uint64 timestamp = 3;
    optional uint32 file_size = 4;
    optional ImageFormat format = 5;
  }
  message Start {
    required uint64 data_id = 1;
    required uint32 slice_index = 2;
    required uint32 client_type = 3;
    required string client_id = 4;
    optional bool is_jump = 5;
    optional string url = 6;
  }
  message Finish {
    required uint64 data_id = 1;
    required uint32 client_type = 2;
    required string client_id = 3;
    optional string url = 4;
  }
  message StartDownloadSliceRequest {
    required uint64 data_id = 1;
    required uint32 client_type = 2;
    required string client_id = 3;
    required uint64 start_timestamp = 4;
    optional string url = 5;
  }
  message StartDownloadSliceResponse {
    required uint64 data_id = 1;
    required ErrorCode error = 2;
    optional uint32 sensor_count = 3;
  }
  message StartDownloadPanoramaPictureRequest {
    required uint64 data_id = 1;
    required uint32 client_type = 2;
    required string client_id = 3;
    required uint32 pos_x = 4;
    required bool is_last = 5;
  }
  message StartDownloadPanoramaPictureResponse {
    required uint64 data_id = 1;
    required ErrorCode error = 2;
    required bool need_app_capture = 3;
  }
  message StopDownloadPanoramaPictureRequest {
    required uint32 client_type = 1;
    required string client_id = 2;
  }
}
message LocalVideoDelete {
  message List {
    repeated LocalVideoDelete list = 1;
  }
  required uint64 start_timestamp = 1;
  required uint64 end_timestamp = 2;
  optional string event_id = 3;
  optional string url = 4;
}
message P2PLiveStream {
  message Start {
    message Request {
      required uint32 client_type = 1;
      required string client_id = 2;
      optional LiveResolutionChoice resolutionChoice = 3;
    }
    message Response {
      required ErrorCode error_code = 1;
      required CODEC video_codec = 2;
      required CODEC audio_codec = 3;
    }
  }
  message Stop {
    required uint32 client_type = 1;
    required string client_id = 2;
  }
}
